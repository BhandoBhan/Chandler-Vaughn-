<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Box 2 Box</title>
    <meta
      name="description"
      content="Box 2 Box: from the box to the full pitch. Find and schedule local pickup soccer — 3v3, 8v8, 11v11, and wager matches."
    />
    <meta name="theme-color" content="#0b7a4b" />
    <meta name="apple-mobile-web-app-title" content="Box 2 Box" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/">
          <img src="/icon.svg" alt="" width="28" height="28" />
          <span>Box <span class="brand-2">2</span> Box</span>
        </a>
        <nav class="topnav" id="topnav" aria-label="Main"></nav>
        <div class="topbar-account" id="account"></div>
      </div>
    </header>
    <main id="view" class="container" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
